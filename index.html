<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opening YouTube...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var videoId = urlParams.get('vid') || urlParams.get('v');
      var listId = urlParams.get('list') || urlParams.get('playlist');

      // Default: Direct Main Channel khulega
      var ytPath = "@itsvirtualinsaan";

      if (listId) {
        ytPath = "playlist?list=" + listId;
      } else if (videoId) {
        ytPath = "watch?v=" + videoId;
      }

      var ytUrl = "www.youtube.com/" + ytPath;
      var fallbackUrl = "https://" + ytUrl;

      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isAndroid) {
        window.location.href = "intent://" + ytUrl + "#Intent;scheme=https;package=com.google.android.youtube;end";
      } else if (isIOS) {
        window.location.href = "vnd.youtube://" + ytUrl;
        setTimeout(function() {
          window.location.href = fallbackUrl;
        }, 1500);
      } else {
        window.location.href = fallbackUrl;
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 25%; background-color: #0f0f0f; color: #ffffff;">
  <p style="font-size: 1.1rem; opacity: 0.85;">Redirecting to YouTube...</p>
</body>
</html>
